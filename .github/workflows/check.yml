name: Check

# Quality gates on every push and pull request (so Dependabot PRs are gated before
# auto-merge). Four jobs, each run only when something it actually inspects changed:
#   • worker  — the worker package's OXC/TypeScript gate (oxfmt + oxlint + type-aware + tsc) + tests
#   • assets  — the browser bundle's identical gate, plus jsdom and wp-playground tests
#   • phpstan — PHP static analysis (level 8, WordPress-aware) via the flake's checks.phpstan
#   • phpunit — the plugin's test suite via the flake's checks.phpunit
# The release build (release.yml) is separate.
#
# `assets` runs on a plain runner rather than through the flake, matching how `worker` is gated:
# the TypeScript toolchain needs node_modules, which the read-only `nix flake check` sandbox has no
# way to populate. Nix still *builds* the bundle (packages.default runs `npm run build` via
# importNpmLock) — it just does not lint it.
#
# Filtering happens per *job*, via a `changes` job the others depend on, rather than with
# `on.push.paths` at the workflow level. That distinction matters: a workflow suppressed by a path
# filter never reports a status at all, so the moment any of these becomes a required check, every
# PR that does not touch that path waits forever for a status that will never arrive. A job skipped
# by `if:` still reports, and GitHub counts it as satisfied.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
      assets: ${{ steps.filter.outputs.assets }}
      php: ${{ steps.filter.outputs.php }}
    steps:
      # Full history: on `push` the filter diffs against the previous commit, which a shallow
      # clone would not have. Pull requests are resolved through the API and need neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Each list is what that job reads, nothing more. This workflow appears in both so a
          # change to CI still validates itself against everything it gates.
          filters: |
            worker:
              - 'worker/**'
              - '.github/workflows/check.yml'
            assets:
              - 'assets/**'
              - 'types/**'
              - 'tests/dom/**'
              - 'tests/playground/**'
              - 'src/WooCommerce.php'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'rolldown.config.ts'
              - 'vitest.config.ts'
              - '.oxlintrc.json'
              - '.oxlintrc.typecheck.json'
              - '.oxfmtrc.json'
              - '.github/workflows/check.yml'
            php:
              - 'src/**'
              - 'tests/**'
              - 'jwt-auth.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan.neon.dist'
              - 'phpstan-bootstrap.php'
              - 'phpunit.xml.dist'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/check.yml'

  worker:
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm test

  assets:
    needs: changes
    if: ${{ needs.changes.outputs.assets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Both lockfiles: the playground harness is a separate package on purpose, so its heavy
          # deps stay out of the lockfile the Nix build consumes.
          cache-dependency-path: |
            package-lock.json
            tests/playground/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      # The plugin's entrypoint requires vendor/autoload.php unconditionally, so playground would
      # fatal on activation without this.
      - run: composer install --no-dev --optimize-autoloader

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npm test

      - run: npm --prefix tests/playground ci

      - run: npm run test:assets

      - run: npm run test:e2e

      - run: npm run test:security

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome

      # The only test that can see a client-side duplicate button; see tests/playground/README.md.
      - run: npm run test:browser
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  phpstan:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      # Self-contained, offline: composerDeps (WordPress/WooCommerce stubs + phpstan-wordpress)
      # come from composer.lock; the phpstan binary from nixpkgs. Builds under pure eval.
      - run: nix build .#checks.x86_64-linux.phpstan -L

  phpunit:
    needs: changes
    if: ${{ needs.changes.outputs.php == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      # Offline for the same reason as phpstan: phpunit and its dependencies come from
      # composer.lock via composerDeps, so the suite needs no network.
      - run: nix build .#checks.x86_64-linux.phpunit -L
